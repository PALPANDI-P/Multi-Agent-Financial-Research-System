# Alembic configuration for the Multi-Agent Financial Research System.
#
# The database URL is intentionally left blank: `migrations/env.py` supplies it
# from `app.core.config.get_settings().database_url`, which in turn reads the
# process environment and `backend/.env`.

[alembic]
# path to migration scripts.
script_location = migrations

# template used to generate migration file names.
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file.
# timezone = UTC

# set to 'true' to run the environment during the 'revision' command.
# revision_environment = false

# version location specification.
# version_locations = %(here)s/migrations/versions

# path separator used when splitting lists of file paths.
path_separator = os

# the output encoding used when revision files are written.
output_encoding = utf-8

# database URL - supplied by migrations/env.py from the application settings.
sqlalchemy.url =


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.


# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S