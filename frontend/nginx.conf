# =============================================================================
# Multi-Agent Financial Research System - nginx configuration of the frontend
# =============================================================================
# The server serves the built single page application and reverse proxies the
# API calls to the backend service of the compose stack.
#
# Two rules matter:
#   * every path that does not exist on disk falls back to `index.html`, so
#     that the client side router of the SPA can handle the deep links,
#   * `/api/` is forwarded to `http://backend:8000` without rewriting the
#     path, so the backend sees the same `/api/v1/...` URLs it sees in
#     development.
# =============================================================================

upstream frs_backend {
    server backend:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The same limit as MAX_UPLOAD_SIZE_BYTES of the backend (50 MiB).
    client_max_body_size 52m;

    # The uploads of the documents are slow, therefore the proxy must not
    # time out while a large PDF is on the wire.
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- the API -------------------------------------------------------------
    location /api/ {
        proxy_pass http://frs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
    }

    # --- the single page application -----------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The entry document is never cached, so that a new deployment is picked
    # up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # The hashed assets of the build are immutable.
    location ~* \.(?:js|css|mjs|woff2?|ttf|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
